version: '3.8'

services:
  mirror:
    build: .
    container_name: pro-mirror-cf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Dhaka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
